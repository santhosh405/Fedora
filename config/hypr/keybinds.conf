# ==================================================
# Hyprland Keybindings (Fedora Pywal Rice)
# ==================================================

$mainMod = SUPER

# Applications & Menus
bind = $mainMod, Q, exec, kitty
bind = $mainMod, Return, exec, kitty
bind = $mainMod, space, exec, wofi --show drun
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, E, exec, nautilus
bind = $mainMod, B, exec, brave-browser
bind = $mainMod SHIFT, B, exec, firefox

# Window Management
bind = $mainMod, C, killactive
bind = ALT, F4, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, M, exit

# Wallpaper & Rice Switching (Super + W)
bind = $mainMod, W, exec, ~/.config/hypr/scripts/setwall.sh

# Wireless Screen Casting (Super + K)
bind = $mainMod, K, exec, ~/.config/hypr/scripts/wireless_cast.sh

# Power & Logout Menu (Super + Escape)
bind = $mainMod, Escape, exec, wlogout -b 6 -c 15 -r 15
bind = $mainMod, L, exec, hyprlock

# Screen Recording (Super + R to toggle, Super + Shift + R for fullscreen)
bind = $mainMod, R, exec, ~/.config/hypr/scripts/screen_record.sh
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/screen_record.sh full

# Screenshots (hyprshot & grim/slurp)
bind = , PRINT, exec, hyprshot -m window
bind = SHIFT, PRINT, exec, hyprshot -m region
bind = ALT, PRINT, exec, hyprshot -m output

# Focus with arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize windows
binde = $mainMod ALT, left, resizeactive, -40 0
binde = $mainMod ALT, right, resizeactive, 40 0
binde = $mainMod ALT, up, resizeactive, 0 -40
binde = $mainMod ALT, down, resizeactive, 0 40

# Swap windows
bind = ALT SHIFT, left, swapwindow, l
bind = ALT SHIFT, right, swapwindow, r
bind = ALT SHIFT, up, swapwindow, u
bind = ALT SHIFT, down, swapwindow, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Mouse scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse window drag/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizeactive

# Volume & Brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media Player
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Hardware controls
binde = SUPER SHIFT, Up, exec, bash ~/.config/hypr/scripts/fan_control.sh up
binde = SUPER SHIFT, Down, exec, bash ~/.config/hypr/scripts/fan_control.sh down
bind = SUPER SHIFT, T, exec, bash ~/.config/hypr/scripts/toggle_refresh_rate.sh
