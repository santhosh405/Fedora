# ==================================================
# Hyprland Autostart
# ==================================================

# Import environment to systemd & dbus
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprland-session.target &

# Core wallpaper daemon
exec-once = swww-daemon &

# Status bar, Notifications & Desktop Clock
exec-once = systemctl --user start waybar.service &
exec-once = swaync &
exec-once = nm-applet --indicator &
exec-once = sleep 0.5 && systemctl --user start home-clock.service &

# Initialize wallpaper and dynamic pywal color palette
exec-once = sleep 1 && ~/.config/hypr/scripts/setwall.sh ~/Pictures/wallpapers/main.jpg &
