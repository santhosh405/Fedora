# ==================================================
# Hyprland Main Configuration (Fedora Pywal Rice)
# ==================================================

$mod = SUPER
$terminal = kitty
$menu = wofi --show drun

# Source modular configuration files
source = ~/.config/hypr/environment.conf
source = ~/.config/hypr/monitor.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/autostart.conf

# Layer rules for frosted glass blur
layerrule = blur, wofi
layerrule = ignorealpha 0.5, wofi
layerrule = blur, waybar
layerrule = ignorealpha 0.5, waybar
layerrule = blur, wlogout

# Window rules for dialogs and control popups
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = pin, class:^(pavucontrol)$

windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$

windowrulev2 = float, class:^(wlogout)$

# XWayland scaling optimization (prevents blurry text on fractional scale)
xwayland {
    force_zero_scaling = true
}