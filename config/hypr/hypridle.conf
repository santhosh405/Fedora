# Hypridle configuration for ASUS TUF Gaming F16 (Fedora)
# Fast, responsive suspend and guaranteed backlight wake

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; brightnessctl set 60%; brightnessctl -d asus::kbd_backlight set 2
}

# Listener 1: Dim display backlight quickly when inactive (90s)
listener {
    timeout = 90
    on-timeout = brightnessctl -s set 20
    on-resume = brightnessctl -r || brightnessctl set 60%
}

# Listener 2: Turn off keyboard backlight (ASUS TUF Aura) (90s)
listener {
    timeout = 90
    on-timeout = brightnessctl -sd asus::kbd_backlight set 0
    on-resume = brightnessctl -rd asus::kbd_backlight || brightnessctl -d asus::kbd_backlight set 2
}

# Listener 3: Lock screen (3 minutes)
listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

# Listener 4: Turn off display DPMS (3.5 minutes)
listener {
    timeout = 210
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; brightnessctl set 60%
}

# Listener 5: Enter suspend / sleep mode fast (5 minutes)
listener {
    timeout = 300
    on-timeout = systemctl suspend
}
