# Animations - Modern, snappy, and fluid
animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshoot, 0.05, 0.9, 0.1, 1.05

    animation = global, 1, 10, default
    animation = border, 1, 5, md3_decel
    animation = windows, 1, 4, md3_decel
    animation = windowsIn, 1, 3.8, overshoot, popin 75%
    animation = windowsOut, 1, 2.5, md3_accel, popin 80%
    animation = windowsMove, 1, 4, overshoot, slide
    animation = fadeIn, 1, 2.5, md3_decel
    animation = fadeOut, 1, 2, md3_accel
    animation = fade, 1, 2.5, md3_decel
    animation = layers, 1, 3.5, md3_decel
    animation = layersIn, 1, 3.2, overshoot, popin 80%
    animation = layersOut, 1, 2, md3_accel, popin 80%
    animation = fadeLayersIn, 1, 2.5, md3_decel
    animation = fadeLayersOut, 1, 2, md3_accel
    animation = workspaces, 1, 4.5, md3_decel, slidefade 20%
    animation = workspacesIn, 1, 4.5, md3_decel, slidefade 20%
    animation = workspacesOut, 1, 4.5, md3_decel, slidefade 20%
}
