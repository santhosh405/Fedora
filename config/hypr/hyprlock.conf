# Hyprlock configuration - Rose Pine Moon / Ghost of Tsushima aesthetic

$font = JetBrains Mono Nerd Font

general {
    hide_cursor = false
    grace = 2
    disable_loading_bar = false
    immediate_render = true
}

background {
    monitor =
    path = /home/fuckwindows/Pictures/wallpaper/ghost-of-tsushima.png
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(246, 193, 119)
    font_size = 85
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(224, 222, 244)
    font_size = 20
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =  $USER
    color = rgb(156, 207, 216)
    font_size = 17
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(196, 167, 231, 0.8)
    inner_color = rgba(42, 39, 63, 0.85)
    font_color = rgb(224, 222, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##6e6a86">Enter Password...</span>
    hide_input = false
    check_color = rgb(246, 193, 119)
    fail_color = rgb(235, 111, 146)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgb(235, 111, 146)
    position = 0, -80
    halign = center
    valign = center
}
