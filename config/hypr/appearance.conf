# ==================================================
# Appearance & Theming (Garuda Dr460nized Red Aesthetic)
# ==================================================

# Load dynamic Pywal palette
source = ~/.cache/wal/colors-hyprland.conf

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgb(ff1a40) rgb(ff5500) 45deg
    col.inactive_border = rgba(1a1020ee)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 0.94
    inactive_opacity = 0.88

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(ff1a4044)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.2
        ignore_opacity = true
        new_optimizations = true
    }
}
