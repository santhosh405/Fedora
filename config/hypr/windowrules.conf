# Window Rules
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    disable_hyprland_guiutils_check = true
}

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
windowrulev2 = float, class:^(hyprland-run)$
windowrulev2 = move 20 monitor_h-120, class:^(hyprland-run)$
windowrulev2 = opacity 0.80 0.80, class:^(code|Code|code-oss|Code - OSS)$
windowrulev2 = float, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.gnome.Settings|blueman-manager)$
windowrulev2 = center, class:^(org.gnome.Settings|blueman-manager)$
windowrulev2 = float, class:^(polkit-gnome-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1|Pinentry-gtk)$
windowrulev2 = float, class:^(HomeClockWidget)$
windowrulev2 = workspace 1, class:^(HomeClockWidget)$
windowrulev2 = nofocus, class:^(HomeClockWidget)$
windowrulev2 = move 608 30, class:^(HomeClockWidget)$
windowrulev2 = float, class:^(com.hypr.applauncher)$
windowrulev2 = center, class:^(com.hypr.applauncher)$
windowrulev2 = pin, class:^(com.hypr.applauncher)$
windowrulev2 = dimaround, class:^(com.hypr.applauncher)$
windowrulev2 = size 780 552, class:^(com.hypr.applauncher)$
windowrulev2 = float, class:^(com.hypr.controlpanel)$
windowrulev2 = float, class:^(msi-control-center)$
windowrulev2 = float, class:^(org.gnome.NetworkDisplays|gnome-network-displays)$
windowrulev2 = center, class:^(org.gnome.NetworkDisplays|gnome-network-displays)$
windowrulev2 = size 720 540, class:^(org.gnome.NetworkDisplays|gnome-network-displays)$
